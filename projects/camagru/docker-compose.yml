services:

  nginx:
    image: docker.io/library/nginx:alpine

    ports:
      - "8080:80"
# :ro read only , on peux lire mais on peux pas modifier les fichier
    volumes:
      - ./public:/var/www/html/public:ro
      - uploads_data:/var/www/html/uploads:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    entrypoint: ["/bin/sh", "-c"]
    command: 
      - 'exec /docker-entrypoint.sh nginx -g "daemon off;" >/dev/null 2>&1'
    depends_on:
      - server-php
    

  server-php:
    build:
      context: .
      dockerfile: docker/server-php/Dockerfile
      
    volumes:
      - .:/var/www/html
      - uploads_data:/var/www/html/uploads
      - ./docker/server-php/zzz-camagru.conf:/usr/local/etc/php-fpm.d/zzz-camagru.conf:ro
    
    command:
      - sh
      - -c
      # - 'exec php-fpm'
      - 'exec php-fpm >/dev/null 2>&1'
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}

      APP_URL: ${APP_URL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_USER: ${SMTP_USER}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      

    depends_on:
      db:
        condition: service_started

  db:
    image: docker.io/library/mariadb:11

    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}

    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

    entrypoint: ["/bin/sh", "-c"]
    command: 
      - 'exec /usr/local/bin/docker-entrypoint.sh mariadbd --innodb-linux-aio=aio >/dev/null 2>&1'


volumes:
  db_data:
    driver: local
  uploads_data:
    driver: local
      
    

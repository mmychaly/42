services:

  nginx:
    image: docker.io/library/nginx:alpine
    ports:
      - "8080:80"
# :ro read only , on peux lire mais on peux pas modifier les fichier
    volumes:
      - ./public:/var/www/html/public:ro
      - uploads_data:/var/www/html/uploads:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - server-php
    

  server-php:
    build:
      context: .
      dockerfile: docker/server-php/Dockerfile

    volumes:
      - .:/var/www/html
      - uploads_data:/var/www/html/uploads

    command: >
      sh -c "chown -R www-data:www-data /var/www/html/uploads && php-fpm"
      
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}

      APP_URL: ${APP_URL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_USER: ${SMTP_USER}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      

    depends_on:
      - db

  db:
    image: docker.io/library/mariadb:11

    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}

    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

volumes:
  db_data:
  uploads_data:
      
    
